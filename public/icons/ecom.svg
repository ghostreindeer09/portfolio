<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Vibrant E-Commerce / AI Blue & Emerald) -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Shopping Bag / Agent Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Success / Resolution Glow Gradient -->
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad2)" />

  <!-- Main Composition Container -->
  <g transform="translate(64, 64)" filter="url(#shadow)">
    
    <!-- Background Chat Bubble (Support Agent Motif) -->
    <path d="M64 48h256c35.3 0 64 28.7 64 64v144c0 35.3-28.7 64-64 64H224l-80 64v-64H64c-35.3 0-64-28.7-64-64V112c0-35.3 28.7-64 64-64z" fill="#1e293b" stroke="#334155" stroke-width="8" />

    <!-- Shopping Bag Icon Centerpiece -->
    <g transform="translate(112, 96)">
      <!-- Bag Body -->
      <path d="M32 40h192l24 160H8z" fill="url(#primaryGrad)" rx="12" />
      <!-- Bag Handles -->
      <path d="M80 40V24c0-22.1 17.9-40 40-40s40 17.9 40 40v16" fill="none" stroke="#f8fafc" stroke-width="12" stroke-linecap="round" />
    </g>

    <!-- Resolution Checkmark Badge (Bottom Right Overlay) -->
    <g transform="translate(240, 210)">
      <!-- Outer Circle Badge -->
      <circle cx="48" cy="48" r="48" fill="#0f172a" stroke="#1e293b" stroke-width="6" />
      <circle cx="48" cy="48" r="40" fill="url(#successGrad)" />
      
      <!-- Checkmark Icon -->
      <path d="M32 48l12 12 24-28" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- AI Sparkle / Automation Accent -->
    <g transform="translate(48, 48)">
      <path d="M24 0l4.5 10.5L39 15l-10.5 4.5L24 30l-4.5-10.5L9 15l10.5-4.5z" fill="#38bdf8" />
    </g>

  </g>
</svg>
