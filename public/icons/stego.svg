<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Scanner / Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Scanline Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Image Frame / Carrier Grid -->
  <g transform="translate(96, 96)">
    <!-- Outer Image Border -->
    <rect x="0" y="0" width="320" height="320" rx="32" fill="none" stroke="#334155" stroke-width="12" />
    
    <!-- Hidden Matrix/Binary Pattern Inside -->
    <path d="M40 80h64v16H40zM140 80h140v16H140zM40 130h96v16H40zM172 130h108v16H172zM40 180h140v16H40zM216 180h64v16H216z" fill="#475569" opacity="0.4" />
    
    <!-- Mountain/Sun graphic representing image carrier -->
    <path d="M40 260l70-70 50 50 70-80 90 100z" fill="#334155" opacity="0.6" />
    <circle cx="110" cy="110" r="24" fill="#475569" opacity="0.6" />

    <!-- Detection Highlights (Revealed hidden data in bright teal/cyan) -->
    <g filter="url(#glow)">
      <!-- Highlighted Hidden Payload (Pixel blocks) -->
      <rect x="180" y="210" width="48" height="48" rx="8" fill="#22d3ee" />
      <text x="204" y="242" font-family="monospace" font-weight="bold" font-size="24" fill="#0f172a" text-anchor="middle">01</text>
    </g>

    <!-- Magnifying Glass / Scanner Overlay -->
    <g transform="translate(140, 140)">
      <!-- Lens Circle -->
      <circle cx="80" cy="80" r="76" fill="none" stroke="url(#accentGrad)" stroke-width="16" />
      <circle cx="80" cy="80" r="76" fill="#0ea5e9" fill-opacity="0.12" />
      
      <!-- Scanner Crosshairs -->
      <line x1="80" y1="16" x2="80" y2="44" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
      <line x1="80" y1="116" x2="80" y2="144" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
      <line x1="16" y1="80" x2="44" y2="80" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
      <line x1="116" y1="80" x2="144" y2="80" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />

      <!-- Magnifying Glass Handle -->
      <path d="M134 134l54 54" stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round" />
    </g>
  </g>
</svg>
